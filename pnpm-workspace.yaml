# sharp backs next/image, which the landing page uses for its product shots (landing-spec §6).
# unrs-resolver unpacks the native binding the Next ESLint resolver needs.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: ">=8.5.28 <9"
  sharp: "0.35.4"
  dompurify: "^3.4.15"
  fast-uri: "^3.1.6"
  js-yaml: "^4.3.2"
  "esbuild@<0.25.0": "^0.25.12"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
