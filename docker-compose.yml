# Compose project stays `sentry-pos` even though this repo is sentry-pos-landing: renaming it
# would point Docker at a new, empty volume and orphan the CMS content already sitting in
# `sentry-pos_sentry-pos-db`. The project name is a data pointer, not a label.
name: sentry-pos

# Local Postgres for the landing CMS. The production host is deliberately undecided — Payload takes a
# plain connection string, so moving to Supabase, Neon or RDS at deploy time is an environment change
# and a dump/restore, nothing more.
services:
  postgres:
    image: postgres:17-alpine
    container_name: sentry-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry_dev_password
      POSTGRES_DB: sentry
    # 5432 is commonly taken by another project's container; the host port stays out of its way.
    ports:
      - "5433:5432"
    volumes:
      - sentry-pos-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentry-pos-db:
